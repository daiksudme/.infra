name: Foundation
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Import existing buckets, inspect a plan, or apply a validated plan
        type: choice
        options: [import, plan, apply]
        default: plan
        required: true
permissions:
  contents: read
concurrency:
  group: foundation-state
  cancel-in-progress: false
jobs:
  foundation:
    if: github.ref == 'refs/heads/main'
    environment: foundation-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
      - run: pnpm install --frozen-lockfile
      - name: Manage foundation resources
        run: node scripts/foundation.mjs "$OPERATION"
        env:
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
