name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [check, format, lock]
        default: check
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ github.event_name == 'workflow_dispatch' && 'terraform-maintenance' || 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - if: inputs.operation == 'format'
        run: terraform fmt -recursive
      - if: inputs.operation == 'lock'
        run: terraform -chdir=terraform/foundation providers lock -platform=linux_amd64
      - if: inputs.operation == 'format' || inputs.operation == 'lock'
        run: git diff -- terraform > "$RUNNER_TEMP/terraform-maintenance.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.operation == 'format' || inputs.operation == 'lock'
        with:
          name: terraform-maintenance
          path: ${{ runner.temp }}/terraform-maintenance.patch
          retention-days: 7
      - run: bash .github/tests/approve.sh
      - run: shellcheck .github/scripts/*.sh .github/tests/*.sh
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform/foundation init -backend=false -lockfile=readonly
      - run: terraform -chdir=terraform/foundation validate
      - run: terraform -chdir=terraform/foundation test
